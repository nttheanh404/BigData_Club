kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    # Map ports để truy cập từ localhost
    extraPortMappings:
      - containerPort: 30092
        hostPort: 9092   # Kafka External
      - containerPort: 30920
        hostPort: 9200   # Elasticsearch
      - containerPort: 30070
        hostPort: 9870   # HDFS NameNode UI
    # Map local folders cho persistence
    extraMounts:
      - hostPath: ./data/kafka
        containerPath: /var/lib/kafka/data
      - hostPath: ./data/es
        containerPath: /usr/share/elasticsearch/data
      - hostPath: ./data/hdfs
        containerPath: /hadoop/dfs/data

  - role: worker
    # Worker node 1
    extraMounts:
      - hostPath: ./data/kafka
        containerPath: /var/lib/kafka/data
      - hostPath: ./data/es
        containerPath: /usr/share/elasticsearch/data
      - hostPath: ./data/hdfs
        containerPath: /hadoop/dfs/data

  - role: worker
    # Worker node 2
    extraMounts:
      - hostPath: ./data/kafka
        containerPath: /var/lib/kafka/data
      - hostPath: ./data/es
        containerPath: /usr/share/elasticsearch/data
      - hostPath: ./data/hdfs
        containerPath: /hadoop/dfs/data

