apiVersion: apps/v1
kind: Deployment
metadata:
  name: crypto-stream-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crypto-stream
  template:
    metadata:
      labels:
        app: crypto-stream
    spec:
      containers:
        - name: spark-processor
          image: an2428/spark-stream-job:latest
          imagePullPolicy: Always
          
          # --- ADDED RESOURCE LIMITS HERE ---
          resources:
            requests:
              memory: "1024Mi"   # Request 1GB
              cpu: "500m"
            limits:
              memory: "2048Mi"   # Limit to 2GB (Crucial for Pandas/Arrow)
              cpu: "1000m"
          # ----------------------------------

          env:
            # --- ADDED SPARK MEMORY ENV VARS ---
            - name: SPARK_DRIVER_MEMORY
              value: "1g"
            - name: SPARK_EXECUTOR_MEMORY
              value: "1g"
            # -----------------------------------

            # CORRECTED URLS:
            - name: HDFS_BASE_PATH
              value: "hdfs://hdfs-service.default.svc.cluster.local:9000/data/crypto"
            - name: CHECKPOINT_DIR
              value: "hdfs://hdfs-service.default.svc.cluster.local:9000/data/checkpoints/crypto"
              
            # Kafka & ES
            - name: KAFKA_BOOTSTRAP
              value: "my-kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
            - name: ES_HOST
              value: "quickstart-es-internal-http.default.svc.cluster.local"
            - name: ES_USER
              value: "elastic"
            - name: ES_PASS
              valueFrom:
                secretKeyRef:
                  name: quickstart-es-elastic-user
                  key: elastic
            - name: ES_SSL_TRUSTSTORE_PATH
              value: "file:///mnt/truststore/elastic-truststore.jks"
            - name: ES_SSL_TRUSTSTORE_PASS
              value: "changeit"
            - name: HADOOP_USER_NAME
              value: "root"

          volumeMounts:
            - name: es-truststore
              mountPath: /mnt/truststore
              readOnly: true
      volumes:
        - name: es-truststore
          secret:
            secretName: es-truststore
